<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseSlice 界面设计伴侣</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif;
            background: #fafaf8;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        body.dark {
            background: #1a1a1c;
            color: #e8e8e6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            color: #232326;
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .dark h1 {
            color: #e8e8e6;
        }

        .subtitle {
            color: #8e8e93;
            text-align: center;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            padding: 30px;
        }

        .dark .panel {
            background: #232326;
            border-color: #2c2c30;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #232326;
            letter-spacing: -0.3px;
        }

        .dark .panel-title {
            color: #e8e8e6;
        }

        /* 欢迎卡片样式 - Notion 风格 */
        .welcome-card {
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            padding: 60px 40px;
            text-align: center;
            max-width: 480px;
            margin: 20px auto;
        }

        .dark .welcome-card {
            background: #232326;
            border-color: #2c2c30;
        }

        .illustration {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            opacity: 0.9;
        }

        .dark .illustration {
            opacity: 0.85;
        }

        .app-title {
            font-size: 24px;
            font-weight: 600;
            color: #232326;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .dark .app-title {
            color: #e8e8e6;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .key-instruction {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            font-size: 18px;
            color: #55555c;
        }

        .dark .key-instruction {
            color: #aeaeb8;
        }

        .key-hint-text {
            font-size: 16px;
            color: #8e8e93;
            font-weight: 400;
        }

        .key-combo {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
        }

        .key {
            background: transparent;
            border: none;
            border-bottom: 2px solid #5b43f5;
            padding: 2px 8px 4px;
            font-size: 20px;
            font-weight: 600;
            color: #232326;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.5px;
        }

        .dark .key {
            color: #e8e8e6;
            border-bottom-color: #7c6bff;
        }

        .times {
            font-size: 18px;
            color: #8e8e93;
            font-weight: 500;
        }

        .welcome-desc {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 32px;
            line-height: 1.6;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .key-inline {
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 3px;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 13px;
            color: #5b43f5;
            font-weight: 500;
        }

        .dark .key-inline {
            background: #2c2c30;
            color: #7c6bff;
        }

        .btn-primary {
            background: #5b43f5;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-primary:hover {
            background: #4a35d4;
        }

        .dark .btn-primary {
            background: #7c6bff;
            color: #171b2a;
        }

        .dark .btn-primary:hover {
            background: #6d5bf5;
        }

        /* 设置页面样式 - Notion 风格 */
        .settings-dialog {
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            padding: 32px;
            max-width: 540px;
            margin: 20px auto;
        }

        .dark .settings-dialog {
            background: #232326;
            border-color: #2c2c30;
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e8e8e4;
        }

        .dark .settings-header {
            border-bottom-color: #2c2c30;
        }

        .settings-icon {
            width: 28px;
            height: 28px;
            opacity: 0.7;
        }

        .settings-title {
            font-size: 18px;
            font-weight: 600;
            color: #232326;
            letter-spacing: -0.4px;
        }

        .dark .settings-title {
            color: #e8e8e6;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 14px;
            color: #232326;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .dark .field-label {
            color: #e8e8e6;
        }

        .field-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            font-size: 14px;
            transition: border-color 0.15s ease;
            background: white;
            color: #232326;
            font-family: inherit;
        }

        .dark .field-input {
            background: #1a1a1c;
            border-color: #2c2c30;
            color: #e8e8e6;
        }

        .field-input:focus {
            outline: none;
            border-color: #232326;
        }

        .dark .field-input:focus {
            border-color: #3a3a3e;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: white;
        }

        .dark .radio-option {
            border-color: #2c2c30;
            background: #1a1a1c;
        }

        .radio-option:hover {
            border-color: #e8e8e4;
            background: #fafaf8;
        }

        .dark .radio-option:hover {
            background: #2c2c30;
            border-color: #3a3a3e;
        }

        .radio-option input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .radio-option label {
            font-size: 14px;
            cursor: pointer;
            color: #232326;
            flex: 1;
        }

        .dark .radio-option label {
            color: #e8e8e6;
        }

        .hint {
            font-size: 12px;
            color: #a9a9ae;
            margin-top: 4px;
            line-height: 1.5;
        }

        .field-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .field-row .field-input {
            flex: 1;
        }

        .field-row-unit {
            font-size: 14px;
            color: #a9a9ae;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #232326;
        }

        .dark .btn-secondary {
            background: #1a1a1c;
            border-color: #2c2c30;
            color: #e8e8e6;
        }

        .btn-secondary:hover {
            background: #fafaf8;
            border-color: #e8e8e4;
        }

        .dark .btn-secondary:hover {
            background: #2c2c30;
        }

        .divider {
            height: 1px;
            background: #e8e8e4;
            margin: 28px 0;
        }

        .dark .divider {
            background: #2c2c30;
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid #e8e8e4;
        }

        .dark .actions {
            border-top-color: #2c2c30;
        }

        .btn-cancel {
            background: white;
            border: 1px solid #e8e8e4;
            color: #232326;
        }

        .dark .btn-cancel {
            background: #1a1a1c;
            border-color: #2c2c30;
            color: #e8e8e6;
        }

        .btn-ok {
            background: #5b43f5;
            border: 1px solid #5b43f5;
            color: white;
        }

        .dark .btn-ok {
            background: #7c6bff;
            border-color: #7c6bff;
            color: #171b2a;
        }

        .btn-cancel, .btn-ok {
            padding: 8px 24px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-ok:hover {
            background: #4a35d4;
            border-color: #4a35d4;
        }

        .dark .btn-ok:hover {
            background: #6d5bf5;
            border-color: #6d5bf5;
        }

        .btn-cancel:hover {
            background: #fafaf8;
        }

        .dark .btn-cancel:hover {
            background: #2c2c30;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border: 1px solid #e8e8e4;
            border-radius: 3px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            color: #232326;
        }

        .dark .theme-switch {
            background: #232326;
            border-color: #2c2c30;
            color: #e8e8e6;
        }

        .theme-switch:hover {
            background: #fafaf8;
        }

        .dark .theme-switch:hover {
            background: #1a1a1c;
        }

        select.field-input {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23787774' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 30px;
        }

        @media (max-width: 1024px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="theme-switch" onclick="toggleTheme()">🌓 切换主题</button>

    <div class="container">
        <h1>MuseSlice 界面设计</h1>
        <p class="subtitle">Notion 风格 · 轻量简洁 · 细线设计</p>

        <div class="panels">
            <!-- 左侧：欢迎卡片 -->
            <div class="panel">
                <h2 class="panel-title">首次打开欢迎卡片</h2>

                <div class="welcome-card">
                    <!-- MuseSlice Logo -->
                    <svg class="illustration" viewBox="0 0 202 241" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- 主形：朝右的播放/切片形 -->
                        <path d="M0 22 Q0 0 19 11 L142 88 Q158 98 142 108 L19 185 Q0 197 0 174 Z" fill="#171B2A"/>

                        <!-- 右上角切口 -->
                        <path d="M122 60 L178 25 Q194 15 194 35 L194 101 Q194 118 179 109 Z" fill="#171B2A"/>

                        <!-- 右下靛蓝切片 -->
                        <path d="M54 197 L151 137 Q164 129 176 140 L193 157 Q202 166 190 174 L94 234 Q82 241 70 232 L53 216 Q43 207 54 197 Z" fill="#5B43F5"/>
                    </svg>

                    <h2 class="app-title">MuseSlice</h2>
                    <p class="welcome-subtitle">快速记录灵感的便签工具</p>

                    <div class="key-instruction">
                        <span class="key-hint-text">按</span>
                        <div class="key-combo">
                            <span class="key">Ctrl</span>
                            <span class="times">×2</span>
                        </div>
                        <span class="key-hint-text">即可唤起</span>
                    </div>

                    <p class="welcome-desc">
                        唤起后按 <span class="key-inline">Tab</span> 即可查看记录
                    </p>

                    <button class="btn-primary">知道了</button>
                </div>
            </div>

            <!-- 右侧：设置页面 -->
            <div class="panel">
                <h2 class="panel-title">设置对话框</h2>

                <div class="settings-dialog">
                    <div class="settings-header">
                        <!-- 简笔画图标 - 设置齿轮 -->
                        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="#5b43f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M19.4 15C19.2669 15.3016 19.2272 15.6362 19.286 15.9606C19.3448 16.285 19.4995 16.5843 19.73 16.82L19.79 16.88C19.976 17.0657 20.1235 17.2863 20.2241 17.5291C20.3248 17.7719 20.3766 18.0322 20.3766 18.295C20.3766 18.5578 20.3248 18.8181 20.2241 19.0609C20.1235 19.3037 19.976 19.5243 19.79 19.71C19.6043 19.896 19.3837 20.0435 19.1409 20.1441C18.8981 20.2448 18.6378 20.2966 18.375 20.2966C18.1122 20.2966 17.8519 20.2448 17.6091 20.1441C17.3663 20.0435 17.1457 19.896 16.96 19.71L16.9 19.65C16.6643 19.4195 16.365 19.2648 16.0406 19.206C15.7162 19.1472 15.3816 19.1869 15.08 19.32C14.7842 19.4468 14.532 19.6572 14.3543 19.9255C14.1766 20.1938 14.0813 20.5082 14.08 20.83V21C14.08 21.5304 13.8693 22.0391 13.4942 22.4142C13.1191 22.7893 12.6104 23 12.08 23C11.5496 23 11.0409 22.7893 10.6658 22.4142C10.2907 22.0391 10.08 21.5304 10.08 21V20.91C10.0723 20.579 9.96512 20.258 9.77251 19.9887C9.5799 19.7194 9.31074 19.5143 9 19.4C8.69838 19.2669 8.36381 19.2272 8.03941 19.286C7.71502 19.3448 7.41568 19.4995 7.18 19.73L7.12 19.79C6.93425 19.976 6.71368 20.1235 6.47088 20.2241C6.22808 20.3248 5.96783 20.3766 5.705 20.3766C5.44217 20.3766 5.18192 20.3248 4.93912 20.2241C4.69632 20.1235 4.47575 19.976 4.29 19.79C4.10405 19.6043 3.95653 19.3837 3.85588 19.1409C3.75523 18.8981 3.70343 18.6378 3.70343 18.375C3.70343 18.1122 3.75523 17.8519 3.85588 17.6091C3.95653 17.3663 4.10405 17.1457 4.29 16.96L4.35 16.9C4.58054 16.6643 4.73519 16.365 4.794 16.0406C4.85282 15.7162 4.81312 15.3816 4.68 15.08C4.55324 14.7842 4.34276 14.532 4.07447 14.3543C3.80618 14.1766 3.49179 14.0813 3.17 14.08H3C2.46957 14.08 1.96086 13.8693 1.58579 13.4942C1.21071 13.1191 1 12.6104 1 12.08C1 11.5496 1.21071 11.0409 1.58579 10.6658C1.96086 10.2907 2.46957 10.08 3 10.08H3.09C3.42099 10.0723 3.742 9.96512 4.0113 9.77251C4.28059 9.5799 4.48572 9.31074 4.6 9C4.73312 8.69838 4.77282 8.36381 4.714 8.03941C4.65519 7.71502 4.50054 7.41568 4.27 7.18L4.21 7.12C4.02405 6.93425 3.87653 6.71368 3.77588 6.47088C3.67523 6.22808 3.62343 5.96783 3.62343 5.705C3.62343 5.44217 3.67523 5.18192 3.77588 4.93912C3.87653 4.69632 4.02405 4.47575 4.21 4.29C4.39575 4.10405 4.61632 3.95653 4.85912 3.85588C5.10192 3.75523 5.36217 3.70343 5.625 3.70343C5.88783 3.70343 6.14808 3.75523 6.39088 3.85588C6.63368 3.95653 6.85425 4.10405 7.04 4.29L7.1 4.35C7.33568 4.58054 7.63502 4.73519 7.95941 4.794C8.28381 4.85282 8.61838 4.81312 8.92 4.68H9C9.29577 4.55324 9.54802 4.34276 9.72569 4.07447C9.90337 3.80618 9.99872 3.49179 10 3.17V3C10 2.46957 10.2107 1.96086 10.5858 1.58579C10.9609 1.21071 11.4696 1 12 1C12.5304 1 13.0391 1.21071 13.4142 1.58579C13.7893 1.96086 14 2.46957 14 3V3.09C14.0013 3.41179 14.0966 3.72618 14.2743 3.99447C14.452 4.26276 14.7042 4.47324 15 4.6C15.3016 4.73312 15.6362 4.77282 15.9606 4.714C16.285 4.65519 16.5843 4.50054 16.82 4.27L16.88 4.21C17.0657 4.02405 17.2863 3.87653 17.5291 3.77588C17.7719 3.67523 18.0322 3.62343 18.295 3.62343C18.5578 3.62343 18.8181 3.67523 19.0609 3.77588C19.3037 3.87653 19.5243 4.02405 19.71 4.21C19.896 4.39575 20.0435 4.61632 20.1441 4.85912C20.2448 5.10192 20.2966 5.36217 20.2966 5.625C20.2966 5.88783 20.2448 6.14808 20.1441 6.39088C20.0435 6.63368 19.896 6.85425 19.71 7.04L19.65 7.1C19.4195 7.33568 19.2648 7.63502 19.206 7.95941C19.1472 8.28381 19.1869 8.61838 19.32 8.92V9C19.4468 9.29577 19.6572 9.54802 19.9255 9.72569C20.1938 9.90337 20.5082 9.99872 20.83 10H21C21.5304 10 22.0391 10.2107 22.4142 10.5858C22.7893 10.9609 23 11.4696 23 12C23 12.5304 22.7893 13.0391 22.4142 13.4142C22.0391 13.7893 21.5304 14 21 14H20.91C20.5882 14.0013 20.2738 14.0966 20.0055 14.2743C19.7372 14.452 19.5268 14.7042 19.4 15Z" stroke="#5b43f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <h3 class="settings-title">MuseSlice 设置</h3>
                    </div>

                    <div class="section">
                        <div class="section-title">唤起方式</div>

                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" name="hotkey" id="doubleTap" checked>
                                <label for="doubleTap">双击左 Ctrl</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="hotkey" id="combo">
                                <label for="combo">只用组合键（不装全局键盘钩子）</label>
                            </div>
                        </div>

                        <div class="field" style="margin-top: 14px;">
                            <label class="field-label">双击判定窗口</label>
                            <div class="field-row">
                                <input type="number" class="field-input" value="300" min="50" max="2000" step="10" style="width: 100px;">
                                <span class="field-row-unit">毫秒</span>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label">备用组合键</label>
                            <input type="text" class="field-input" value="Ctrl+Alt+N" readonly>
                            <div class="hint">按一下就录制。Ctrl+Space 留给输入法，不可占用。</div>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="section">
                        <div class="section-title">日记与外观</div>

                        <div class="field">
                            <label class="field-label">日记目录</label>
                            <div class="field-row">
                                <input type="text" class="field-input" value="D:\Notes">
                                <button class="btn-secondary">…</button>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label">主题</label>
                            <select class="field-input" style="width: 150px;">
                                <option>跟随系统</option>
                                <option>浅色</option>
                                <option>深色</option>
                            </select>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-cancel">取消</button>
                        <button class="btn-ok">确定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDark = false;

        function toggleTheme() {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);

            // 更新 Logo 颜色（主形和切口）
            const logoPaths = document.querySelectorAll('.illustration path:nth-child(1), .illustration path:nth-child(2)');
            logoPaths.forEach(el => {
                if (isDark) {
                    el.setAttribute('fill', '#e8e8e6'); // 深色模式：主形翻成近白
                } else {
                    el.setAttribute('fill', '#171B2A'); // 浅色模式：炭黑
                }
            });

            // 更新 Logo 切片颜色
            const slicePath = document.querySelector('.illustration path:nth-child(3)');
            if (slicePath) {
                if (isDark) {
                    slicePath.setAttribute('fill', '#7c6bff'); // 深色模式：靛蓝提亮
                } else {
                    slicePath.setAttribute('fill', '#5B43F5'); // 浅色模式：品牌靛蓝
                }
            }

            // 更新设置图标颜色
            const settingsIcon = document.querySelectorAll('.settings-icon path');
            settingsIcon.forEach(el => {
                if (isDark) {
                    el.setAttribute('stroke', '#7c6bff');
                } else {
                    el.setAttribute('stroke', '#5b43f5');
                }
            });
        }
    </script>
</body>
</html>
